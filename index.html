 saves power",b:"Machine power scales with clock speed to the power of ~1.32 (1.321929 in the game data). Running more machines underclocked uses less power than fewer machines overclocked for the same output."},{c:"Power",t:"Power Shards raise the clock cap",b:"Each Power Shard slot adds +50% to the maximum clock speed: 150% with one, 200% with two, 250% with three."},{c:"Power",t:"Watch the fuse",b:"If consumption exceeds production the fuse trips and the whole grid stops. Add generators or reduce load, then reset the fuse from a generator."},{c:"Power",t:"Power Storage smooths spikes",b:"Power Storage buildings charge from surplus and discharge when demand exceeds supply, which helps ride out spikes and brief fuel shortages."},{c:"Power",t:"Separate critical systems",b:"Use Power Switches to split your grid so that fuel production for generators keeps running if other factories overload the grid."},{c:"Power",t:"Generator fuel math",b:"Fuel burned per minute = generator MW × 60 ÷ fuel energy (MJ). See the Tools tab for a table computed from the game data (e.g. Coal Generator: 75 MW, Coal 300 MJ → 15 coal/min)."},{c:"Power",t:"Geothermal needs no fuel",b:"Geothermal Generators placed on geysers generate power without any fuel input. Their output depends on the geyser purity and varies over time, so do not rely on the peak value."},{c:"Logistics",t:"Know your belt caps",b:"Conveyor Belt Mk.1–Mk.6 carry 60 / 120 / 270 / 480 / 780 / 1200 items per minute. Lifts have the same caps per tier."},{c:"Logistics",t:"Know your pipe caps",b:"Pipeline Mk.1 carries up to 300 m³/min and Pipeline Mk.2 up to 600 m³/min."},{c:"Logistics",t:"Pumps for height",b:"Fluids flow downhill freely, but pushing fluids upward needs Pipeline Pumps (Mk.1 ≈ 20 m of head lift, Mk.2 ≈ 50 m)."},{c:"Logistics",t:"Manifolds are fine",b:"A simple manifold (one belt with splitters feeding each machine) looks uneven at first but saturates once the machines' input buffers fill. Load-balancing is only nee  ends, which avoids head-on deadlocks."},{c:"Trains & drones",t:"Trains draw power through the rails",b:"Locomotives take power from the railway, which is powered via Train Stations connected to your grid."},{c:"Trains & drones",t:"Drones need fuel and power",b:"Drone Ports need a power connection and a fuel supply for their drones (Batteries are the common choice). They are great for low-volume, long-distance deliveries."},{c:"Trains & drones",t:"Vehicles follow recorded paths",b:"Trucks and Tractors can drive a recorded route automatically between Truck Stations; keep routes clear of obstacles."},{c:"Building",t:"Build on foundations",b:"Foundations snap to an 8 m grid and machines snap to foundations, which keeps factories tidy and makes belt routing much easier."},{c:"Building",t:"Copy a building quickly",b:"Middle-click an existing building or belt with the Build Gun to select the same building/recipe for placement."},{c:"Building",t:"Use Blueprints",b:"The Blueprint Designer lets you save a group of buildings as a blueprint and stamp it down repeatedly."},{c:"Building",t:"Leave room to grow",b:"Leave space next to production lines and plan belts on a separate level so you can add machines later without rebuilding."},{c:"Building",t:"Label everything",b:"Signs and Storage Containers near each line help you remember what goes where on a big factory floor."},{c:"Building",t:"Travel faster",b:"Hypertubes, Jump Pads, Ziplines (on power lines) and vehicles make big factories much quicker to traverse."},{c:"Building",t:"Somersloops boost output",b:"Somersloops placed in a machine's Production Amplification slots increase output (up to double when all slots are filled) at a large extra power cost."},{c:"Alternate recipes",t:"Hard Drive research",b:"Each Hard Drive researched in the MAM lets you pick one alternate recipe from a random selection. Alternates are optional, but several are big upgrades."},{c:"Alternate recipes",t:"Often recommended: ingots",b:"Solid Steel
